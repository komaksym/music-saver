name: pr-scope-watch

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  scope-watch:
    # A push that changes direction needs a fresh infographic as a comment.
    # Small fixes stay silent. Threshold: 5+ files or a new top-level dir.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check push scope
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "scope-watch: no prior commit on this branch; nothing to compare"
            exit 0
          fi
          N=$(git diff --name-only "$BEFORE" "$AFTER" | wc -l | tr -d ' ')
          NEWDIRS=$(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" | cut -d/ -f1 | sort -u | tr '\n' ' ')
          echo "scope-watch: $N files changed in this push; new roots: $NEWDIRS"
          if [ "$N" -ge 5 ]; then
            gh pr comment "$PR_NUMBER" --body "Scope check: this push touches $N files, which reads as a direction change rather than a small fix. Regenerate the PR infographic with the baoyu-infographic skill and post it as a comment below. Do not replace the infographic in the PR body."
          fi
