name: spotify-e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spotify-e2e-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify extension
        run: npm run verify
      - name: Install browser harness
        run: npx --no-install agent-browser install --with-deps
      - name: Run extension matrix in virtual display
        run: PATH="$PWD/node_modules/.bin:$PATH" xvfb-run --auto-servernum node scripts/spotify-e2e.mjs fixture
      - name: Upload deterministic browser proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spotify-e2e-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts/fixture/
          if-no-files-found: error
          retention-days: 7
