name: spotify-e2e-live

on:
  workflow_dispatch:
    inputs:
      decision_clips:
        description: Record only the automatic save and skip decisions
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  spotify-e2e-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: spotify-e2e-dedicated-account
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Build tested extension
        run: npm run build
      - name: Install browser harness
        run: npx --no-install agent-browser install --with-deps
      - name: Install video recorder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Restore dedicated Spotify authentication
        env:
          COOKIES_B64: ${{ secrets.SPOTIFY_E2E_COOKIES_B64 }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          if (!process.env.COOKIES_B64) throw Error('Missing dedicated Spotify cookie secret. Live E2E cannot skip authentication.');
          const cookies = JSON.parse(Buffer.from(process.env.COOKIES_B64, 'base64').toString('utf8'));
          if (!Array.isArray(cookies) || !cookies.some(c => c.name === 'sp_dc' && c.value)) throw Error('Dedicated Spotify session is missing.');
          if (cookies.some(c => !/(^|\.)spotify\.com$/.test(c.domain || ''))) throw Error('Only Spotify cookies are accepted.');
          writeFileSync(`${process.env.RUNNER_TEMP_DIR}/spotify-cookies.json`, JSON.stringify(cookies), { mode: 0o600 });
          JS
      - name: Test actual Spotify song and persistent session
        env:
          SPOTIFY_E2E_PROFILE: ${{ runner.temp }}/spotify-profile
          SPOTIFY_E2E_COOKIE_FILE: ${{ runner.temp }}/spotify-cookies.json
          SPOTIFY_E2E_TRACK_ID: ${{ vars.SPOTIFY_E2E_TRACK_ID || '7LoBfKLpz4BGrxCuOzAKRz' }}
          SPOTIFY_E2E_RECORD: '1'
          SPOTIFY_E2E_MUTATE_LIKED: '1'
          SPOTIFY_E2E_DECISION_CLIPS: ${{ inputs.decision_clips && '1' || '0' }}
        run: PATH="$PWD/node_modules/.bin:$PATH" xvfb-run --auto-servernum node scripts/spotify-e2e.mjs live
      - name: Upload sanitized live browser proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: spotify-e2e-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts/live/
          if-no-files-found: warn
          retention-days: 3
      - name: Remove ephemeral authentication
        if: always()
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: rm -rf "$RUNNER_TEMP_DIR/spotify-profile" "$RUNNER_TEMP_DIR/spotify-cookies.json"
