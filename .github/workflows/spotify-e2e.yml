name: spotify-e2e

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  spotify-e2e-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify extension
        run: npm run verify
      - name: Install browser harness
        run: npm install --global agent-browser@0.38.2 && agent-browser install --with-deps
      - name: Run extension matrix in virtual display
        run: xvfb-run --auto-servernum npm run e2e:fixture
      - name: Verify fixture browser proof
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const proof = JSON.parse(readFileSync('e2e-artifacts/fixture/results.json', 'utf8'));
          const failures = proof.results.filter((entry) => entry.status !== 'passed');
          const badChecks = proof.results.flatMap((entry) => (entry.assertions || []).filter((assertion) => !assertion.ok));
          if (!proof.passed || failures.length || badChecks.length) {
            console.error(JSON.stringify({ passed: proof.passed, cleanupError: proof.cleanupError, failures, badChecks }, null, 2));
            throw Error('Fixture browser proof failed');
          }
          if (proof.scenarioCount < 19) throw Error(`Expected at least 19 fixture entries, found ${proof.scenarioCount}`);
          for (const entry of proof.results) console.log(`${entry.id}: ${entry.assertions.length} assertions`);
          console.log(`Fixture proof ok: ${proof.scenarioCount} entries, bundle ${proof.bundleSha256}, ${proof.agentBrowser}`);
          JS
      - name: Upload deterministic browser proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spotify-e2e-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts/fixture/
          if-no-files-found: error
          retention-days: 7

  spotify-e2e-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: spotify-e2e-dedicated-account
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Build tested extension
        run: npm run build
      - name: Install browser harness
        run: npm install --global agent-browser@0.38.2 && agent-browser install --with-deps
      - name: Restore dedicated Spotify authentication
        env:
          COOKIES_B64: ${{ secrets.SPOTIFY_E2E_COOKIES_B64 }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          if (!process.env.COOKIES_B64) throw Error('Missing dedicated Spotify cookie secret. Live E2E cannot skip authentication.');
          const cookies = JSON.parse(Buffer.from(process.env.COOKIES_B64, 'base64').toString('utf8'));
          if (!Array.isArray(cookies) || !cookies.some(c => c.name === 'sp_dc' && c.value)) throw Error('Dedicated Spotify session is missing.');
          if (cookies.some(c => !/(^|\.)spotify\.com$/.test(c.domain || ''))) throw Error('Only Spotify cookies are accepted.');
          writeFileSync(`${process.env.RUNNER_TEMP_DIR}/spotify-cookies.json`, JSON.stringify(cookies), { mode: 0o600 });
          JS
      - name: Test actual Spotify song and persistent session
        env:
          SPOTIFY_E2E_PROFILE: ${{ runner.temp }}/spotify-profile
          SPOTIFY_E2E_COOKIE_FILE: ${{ runner.temp }}/spotify-cookies.json
          SPOTIFY_E2E_TRACK_ID: ${{ vars.SPOTIFY_E2E_TRACK_ID || '7LoBfKLpz4BGrxCuOzAKRz' }}
        run: xvfb-run --auto-servernum npm run e2e:live
      - name: Verify live browser proof
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const proof = JSON.parse(readFileSync('e2e-artifacts/live/results.json', 'utf8'));
          const failures = proof.results.filter((entry) => entry.status !== 'passed');
          const badChecks = proof.results.flatMap((entry) => (entry.assertions || []).filter((assertion) => !assertion.ok));
          if (!proof.passed || failures.length || badChecks.length) {
            console.error(JSON.stringify({ passed: proof.passed, cleanupError: proof.cleanupError, failures, badChecks }, null, 2));
            throw Error('Live Spotify browser proof failed. A missing session, unsupported playback, or a changed selector is a failure, never a skip.');
          }
          if (proof.scenarioCount < 10) throw Error(`Expected at least 10 live entries, found ${proof.scenarioCount}`);
          for (const entry of proof.results) console.log(`${entry.id}: ${entry.assertions.length} assertions`);
          console.log(`Live proof ok: ${proof.scenarioCount} entries, bundle ${proof.bundleSha256}, ${proof.agentBrowser}`);
          JS
      - name: Upload sanitized live browser proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spotify-e2e-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts/live/
          if-no-files-found: error
          retention-days: 3
      - name: Remove ephemeral authentication
        if: always()
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          if [ -z "$RUNNER_TEMP_DIR" ]; then
            echo "::error::RUNNER_TEMP_DIR is empty; refusing to delete an absolute path."
            exit 1
          fi
          rm -rf -- "$RUNNER_TEMP_DIR/spotify-profile" "$RUNNER_TEMP_DIR/spotify-cookies.json"
