name: pr-hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_call:
    inputs:
      pr_body:
        description: PR body text to check
        required: true
        type: string
      repo:
        description: Owner/repo carrying scripts/check-pr-body.sh
        required: false
        default: ''
        type: string
      head_sha:
        description: PR head SHA under check
        required: false
        default: ''
        type: string

permissions:
  pull-requests: read

jobs:
  pr-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.repo || github.repository }}
          sparse-checkout: scripts/check-pr-body.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Check PR body headings
        env:
          BODY: ${{ github.event.pull_request.body || inputs.pr_body }}
        run: bash scripts/check-pr-body.sh
