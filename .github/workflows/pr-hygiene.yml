name: pr-hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR body headings
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "Checking PR body for required headings..."
          missing=0
          for h in '## What changes' '## How to verify' '## Risk'; do
            if ! printf '%s' "$BODY" | grep -Fq "$h"; then
              echo "::error::Missing required heading: $h"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "PR body must contain ## What changes, ## How to verify, and ## Risk (see .github/pull_request_template.md)."
            exit 1
          fi
          echo "All required headings present."
