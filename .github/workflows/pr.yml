name: pr

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: komaksym/pr-gate/.github/workflows/checks.yml@d9054a367abf36081d50f80ce39a16b336a87f53 # v1.0.0
    permissions:
      contents: read
      pull-requests: read

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser harness
        run: npx --no-install agent-browser install --with-deps
      - name: Run extension matrix in virtual display
        run: PATH="$PWD/node_modules/.bin:$PATH" xvfb-run --auto-servernum node scripts/spotify-e2e.mjs fixture
      - name: Upload deterministic browser proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: spotify-e2e-fixture-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-artifacts/fixture/
          if-no-files-found: error
          retention-days: 7

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage with GitHub identity
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          use_oidc: true
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true

  gate:
    if: always()
    needs: [checks, e2e, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - if: needs.checks.result != 'success' || needs.e2e.result != 'success' || needs.coverage.result != 'success'
        run: exit 1
      - run: echo gate passed
