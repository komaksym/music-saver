name: cubic-gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted]
  workflow_call:
    inputs:
      repo:
        description: Owner/repo the PR belongs to
        required: false
        default: ''
        type: string
      head_sha:
        description: PR head SHA to gate
        required: true
        type: string
      pr_number:
        description: PR number to gate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: cubic-gate-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  cubic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BLOCK_PRIORITIES: "P0 P1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.repo || github.repository }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fail while blocking Cubic threads exist
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          RUN_STARTED_AT: ${{ github.event.review.submitted_at || github.event.pull_request.updated_at }}
        run: bash scripts/check-cubic-gate.sh "$HEAD_SHA" "$PR_NUMBER"
