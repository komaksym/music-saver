name: cubic-gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cubic-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cubic-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BLOCK_PRIORITIES: "P0 P1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail while blocking Cubic threads exist
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_STARTED_AT: ${{ github.event.pull_request.updated_at }}
        run: bash scripts/check-cubic-gate.sh "$HEAD_SHA" "$PR_NUMBER"
