name: pr-gates

on:
  pull_request:
    types: [opened, synchronize, edited, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch base
        run: git fetch origin ${{ github.base_ref }}
      - name: Check platform guards (shared script)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view ${{ github.event.pull_request.number }} --json body --jq .body > /tmp/pr-body.md
          bash scripts/check-platform-guards.sh --base origin/${{ github.base_ref }} --body-file /tmp/pr-body.md --branch "${{ github.head_ref }}"
      - name: Comment fix guidance
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "PR readiness gate failed for this push. Read the ready job log for the named section, then fix the body with .github/pull_request_template.md or open the PR through scripts/pr-create.sh so the gate runs before gh runs."

  scope-watch:
    # A push that changes direction needs a fresh infographic as a comment.
    # Small fixes stay silent. Threshold: 5+ files or a new top-level dir.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check push scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          N=$(git diff --name-only "$BEFORE" "$SHA" | wc -l)
          NEWDIRS=$(git diff --name-only --diff-filter=A "$BEFORE" "$SHA" | cut -d/ -f1 | sort -u | tr '\n' ' ')
          echo "scope-watch: $N files changed in this push; new roots: $NEWDIRS"
          if [ "$N" -ge 5 ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body "Scope check: this push touches $N files, which reads as a direction change rather than a small fix. Regenerate the PR infographic with the baoyu-infographic skill and post it as a comment below. Do not replace the infographic in the PR body."
          fi
