name: pr-ready

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  checks: read
  statuses: read

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse merge conflicts with base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF"
          base="origin/$BASE_REF"
          mb=$(git merge-base HEAD "$base")
          if git merge-tree "$mb" HEAD "$base" | grep -q '^+<<<<<<< '; then
            echo "::error::PR conflicts with $base; rebase or merge it first"
            exit 1
          fi
          echo "Merge against $base is clean."
      - name: Roll up required checks into ready
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-ready-rollup.sh "$HEAD_SHA"
