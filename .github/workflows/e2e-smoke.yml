name: e2e-smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: e2e-smoke-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install agent-browser
        run: npm install -g agent-browser@0.38.2 && agent-browser install --with-deps
      - name: Run E2E smoke (headless)
        env:
          E2E_SESSION: ms-e2e-smoke-${{ github.run_id }}
        run: bash scripts/e2e-agent-browser.sh smoke
      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-smoke-${{ github.run_id }}
          path: e2e-artifacts/
          if-no-files-found: ignore
          retention-days: 14
