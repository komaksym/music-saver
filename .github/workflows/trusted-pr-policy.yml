name: trusted-pr-policy

on:
  # Only main-owned scripts run. PR content is read as API data, never executed.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to re-evaluate
        required: true
        type: number

permissions: {}

concurrency:
  group: trusted-pr-policy-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: komaksym/music-saver
          ref: main
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Inspect PR metadata without running PR code
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: node scripts/check-trusted-pr-policy.mjs --publish
