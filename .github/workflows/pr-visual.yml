name: pr-visual

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_call:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - name: Require an infographic link on the PR body
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          pr = event['pull_request']
          body = pr.get('body') or ''
          repo = event['repository']['full_name']
          head = pr['head']['ref']
          prefix = f'https://github.com/{repo}/blob/{head}/'
          for url in re.findall(r'!\[[^\]]*\]\(([^)]+)\)', body):
              if prefix in url and url.lower().endswith('.png?raw=true'):
                  print('PR body links an infographic on this branch')
                  sys.exit(0)
          print('::error::PR body has no infographic. Commit a PNG to this branch and embed '
                + 'https://github.com/' + repo + '/blob/' + head + '/<path>.png?raw=true')
          sys.exit(1)
          PY

