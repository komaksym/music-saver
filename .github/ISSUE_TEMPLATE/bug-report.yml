name: Bug report
description: Report a bug in the extension, build, or E2E harness
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Load the unpacked extension from extension/
        2. Play a track on open.spotify.com
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please complete the following information.
      value: |
        - OS: [e.g. macOS 14, Ubuntu 24.04, Windows 11]
        - Chrome version: [e.g. 141.0.7390.55]
        - Extension version / commit: [e.g. 0.1.0 / abc1234]
        - Spotify plan: [e.g. Free]
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I have searched for existing issues and this is not a duplicate
          required: true
