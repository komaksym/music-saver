coverage:
  status:
    project:
      default:
        target: auto
        informational: true
    patch:
      default:
        target: 80%
        threshold: 0%
        if_not_found: failure

ignore:
  - "extension/content.bundle.js"
  - "tests/**"
  - "scripts/**"

comment:
  layout: "diff, files"
  require_changes: true
