<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#0b1626;display:flex;justify-content:center}svg{width:1600px;height:900px}</style></head><body>
<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
<rect width="1600" height="900" fill="#0b1626"/>
<text x="800" y="70" fill="#fff" font-size="44" font-weight="700" text-anchor="middle">Sounded-Time Budget Fix</text>
<text x="800" y="105" fill="#8fa3bf" font-size="20" text-anchor="middle">music-saver Spotify auto-save in background tabs, live-verified muted</text>
<rect x="60" y="140" width="700" height="640" rx="14" fill="none" stroke="#e5484d" stroke-width="3"/>
<text x="410" y="190" fill="#e5484d" font-size="30" font-weight="700" text-anchor="middle">BEFORE: per-tick clip</text>
<text x="110" y="240" fill="#c9d6e8" font-size="21">Watch ticks every 1s</text>
<text x="110" y="275" fill="#c9d6e8" font-size="21">Spotify progress bar jumps every ~5s in background</text>
<text x="110" y="310" fill="#c9d6e8" font-size="21">min(progress, wall-gap) credits 1s per 5s jump</text>
<g font-size="19" fill="#8fa3bf"><text x="110" y="380">tick 1s</text><rect x="110" y="395" width="40" height="26" fill="#e5484d"/><text x="110" y="455">tick 1s</text><rect x="110" y="470" width="40" height="26" fill="#e5484d"/><text x="110" y="545">jump 5s</text><rect x="110" y="560" width="40" height="26" fill="#e5484d"/><text x="165" y="583" fill="#e5484d">clipped to 1s</text></g>
<text x="410" y="660" fill="#e5484d" font-size="26" font-weight="700" text-anchor="middle">5:1 undercount</text>
<text x="410" y="700" fill="#c9d6e8" font-size="22" text-anchor="middle">threshold never reached, track never saves</text>
<text x="410" y="735" fill="#c9d6e8" font-size="22" text-anchor="middle">unit test: 3000 != 15000</text>
<rect x="840" y="140" width="700" height="640" rx="14" fill="none" stroke="#46a758" stroke-width="3"/>
<text x="1190" y="190" fill="#46a758" font-size="30" font-weight="700" text-anchor="middle">AFTER: playing-time budget</text>
<text x="890" y="240" fill="#c9d6e8" font-size="21">Accumulate wall time while playing</text>
<text x="890" y="275" fill="#c9d6e8" font-size="21">Credit each jump against the budget</text>
<text x="890" y="310" fill="#c9d6e8" font-size="21">Large jumps capped to the current wall gap</text>
<g font-size="19" fill="#8fa3bf"><text x="890" y="380">budget 5s</text><rect x="890" y="395" width="200" height="26" fill="#46a758"/><text x="890" y="455">jump 5s</text><rect x="890" y="470" width="200" height="26" fill="#46a758"/><text x="1100" y="493" fill="#46a758">credited in full</text><text x="890" y="545">seek +55s</text><rect x="890" y="560" width="40" height="26" fill="#46a758"/><text x="945" y="583" fill="#46a758">capped ~1s</text></g>
<text x="1190" y="660" fill="#46a758" font-size="26" font-weight="700" text-anchor="middle">1:1 tracking</text>
<text x="1190" y="700" fill="#c9d6e8" font-size="22" text-anchor="middle">Ripples saved at 90%, Say It Right skipped</text>
<text x="1190" y="735" fill="#c9d6e8" font-size="22" text-anchor="middle">72/72 tests green</text>
<text x="800" y="830" fill="#8fa3bf" font-size="20" text-anchor="middle">SoundedTimeSampler: seek credits wall; else delta = min(progress, playingWall - credited)</text>
</svg>
</body></html>
